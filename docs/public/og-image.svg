<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111827"/>

  <!-- Decorative gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Logo background -->
  <rect x="520" y="140" width="160" height="160" rx="24" fill="#1f2937"/>

  <!-- Logo letter -->
  <text x="600" y="240" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#60a5fa">A</text>

  <!-- Site name -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">星智未來</text>

  <!-- Tagline -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#9ca3af">以 AI 與工程實踐創造價值</text>

  <!-- URL -->
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6b7280">blog.aidream.com.tw</text>

  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="4" fill="#3b82f6" opacity="0.3"/>
  <circle cx="150" cy="80" r="3" fill="#3b82f6" opacity="0.2"/>
  <circle cx="1100" cy="530" r="4" fill="#3b82f6" opacity="0.3"/>
  <circle cx="1050" cy="550" r="3" fill="#3b82f6" opacity="0.2"/>
</svg>
