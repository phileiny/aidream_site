<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>激活函數視覺化 | 星智未來</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white; 
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    
    .title { text-align: center; margin-bottom: 24px; }
    .title h1 { font-size: 26px; margin-bottom: 8px; }
    .title p { color: #94a3b8; font-size: 14px; }
    
    .card { 
      background: rgba(30, 41, 59, 0.9); 
      border-radius: 16px; 
      padding: 24px; 
      margin-bottom: 20px;
    }
    .card h2 { 
      font-size: 17px; margin-bottom: 16px; 
      display: flex; align-items: center; gap: 10px;
    }

    /* 選擇器 */
    .func-selector {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .func-btn {
      padding: 12px 20px;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .func-btn:hover { border-color: #60a5fa; }
    .func-btn.active { 
      border-color: #3b82f6; 
      background: rgba(59, 130, 246, 0.2);
    }
    .func-btn .emoji { margin-right: 6px; }

    /* 圖表區 */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
    .chart-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
    }
    .chart-box h3 {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 12px;
      text-align: center;
    }
    .chart-svg {
      display: block;
      width: 100%;
    }

    /* 公式區 */
    .formula-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 600px) {
      .formula-grid { grid-template-columns: 1fr; }
    }
    .formula-item h4 {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .formula-math {
      font-family: 'Times New Roman', serif;
      font-size: 18px;
      color: #e2e8f0;
      padding: 12px;
      background: #1e293b;
      border-radius: 8px;
      text-align: center;
    }
    .formula-math .frac {
      display: inline-block;
      vertical-align: middle;
      text-align: center;
    }
    .formula-math .frac-num { border-bottom: 1px solid #e2e8f0; padding-bottom: 2px; }
    .formula-math .frac-den { padding-top: 2px; }

    /* 互動測試 */
    .test-section {
      margin-top: 20px;
      padding: 20px;
      background: #1e293b;
      border-radius: 12px;
    }
    .test-section h3 {
      font-size: 15px;
      margin-bottom: 16px;
    }
    .test-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .test-input {
      flex: 1;
      min-width: 200px;
    }
    .test-input label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .test-input input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 8px;
      background: #334155;
      border-radius: 4px;
    }
    .test-input input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }
    .test-results {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .test-result {
      background: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      min-width: 100px;
    }
    .test-result .label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
    .test-result .value { font-size: 20px; font-weight: 700; }
    .test-result .value.positive { color: #4ade80; }
    .test-result .value.negative { color: #f87171; }
    .test-result .value.zero { color: #fbbf24; }

    /* 特性卡片 */
    .props-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .prop-card {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }
    .prop-card .icon { font-size: 24px; margin-bottom: 8px; }
    .prop-card .label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
    .prop-card .value { font-size: 14px; font-weight: 600; }
    .prop-card .value.good { color: #4ade80; }
    .prop-card .value.bad { color: #f87171; }
    .prop-card .value.warn { color: #fbbf24; }

    /* 為什麼需要非線性 */
    .why-section {
      margin-top: 20px;
    }
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 16px;
    }
    @media (max-width: 600px) {
      .comparison { grid-template-columns: 1fr; }
    }
    .comparison-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      border: 2px solid transparent;
    }
    .comparison-box.bad { border-color: #ef4444; }
    .comparison-box.good { border-color: #10b981; }
    .comparison-box h4 {
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .comparison-box p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .comparison-box .code {
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      margin-top: 10px;
      line-height: 1.5;
    }

    /* 所有函數比較 */
    .all-funcs {
      margin-top: 20px;
    }
    .func-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .func-table th, .func-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    .func-table th {
      color: #64748b;
      font-weight: 500;
    }
    .func-table td:first-child {
      font-weight: 600;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .tag-good { background: rgba(16, 185, 129, 0.2); color: #4ade80; }
    .tag-bad { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .tag-warn { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }

    .footer { text-align: center; color: #475569; font-size: 12px; margin-top: 30px; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;

    function ActivationFunctions() {
      const [selectedFunc, setSelectedFunc] = useState('relu');
      const [testInput, setTestInput] = useState(0.5);

      // 激活函數定義
      const functions = {
        relu: {
          name: 'ReLU',
          fullName: 'Rectified Linear Unit',
          emoji: '📐',
          fn: (x) => Math.max(0, x),
          derivative: (x) => x > 0 ? 1 : 0,
          formula: 'max(0, x)',
          derivFormula: '1 if x > 0, else 0',
          range: '[0, ∞)',
          pros: ['計算快速', '不會飽和(正區)', '稀疏激活'],
          cons: ['Dead ReLU 問題', '輸出非零均值'],
          color: '#3b82f6',
          useCase: '隱藏層首選，CNN 標配'
        },
        leakyRelu: {
          name: 'Leaky ReLU',
          fullName: 'Leaky Rectified Linear Unit',
          emoji: '📉',
          fn: (x) => x > 0 ? x : 0.01 * x,
          derivative: (x) => x > 0 ? 1 : 0.01,
          formula: 'x if x > 0, else 0.01x',
          derivFormula: '1 if x > 0, else 0.01',
          range: '(-∞, ∞)',
          pros: ['解決 Dead ReLU', '計算快速'],
          cons: ['需調整斜率', '效果不穩定'],
          color: '#8b5cf6',
          useCase: '當 ReLU 效果不好時嘗試'
        },
        sigmoid: {
          name: 'Sigmoid',
          fullName: 'Logistic Sigmoid',
          emoji: '🌊',
          fn: (x) => 1 / (1 + Math.exp(-x)),
          derivative: (x) => {
            const s = 1 / (1 + Math.exp(-x));
            return s * (1 - s);
          },
          formula: '1 / (1 + e⁻ˣ)',
          derivFormula: 'σ(x) × (1 - σ(x))',
          range: '(0, 1)',
          pros: ['輸出像機率', '平滑可微'],
          cons: ['梯度消失', '計算較慢', '非零均值'],
          color: '#f59e0b',
          useCase: '二分類輸出層、門控機制'
        },
        tanh: {
          name: 'Tanh',
          fullName: 'Hyperbolic Tangent',
          emoji: '〰️',
          fn: (x) => Math.tanh(x),
          derivative: (x) => 1 - Math.pow(Math.tanh(x), 2),
          formula: '(eˣ - e⁻ˣ) / (eˣ + e⁻ˣ)',
          derivFormula: '1 - tanh²(x)',
          range: '(-1, 1)',
          pros: ['零均值輸出', '比 sigmoid 梯度大'],
          cons: ['梯度消失', '計算較慢'],
          color: '#10b981',
          useCase: 'RNN/LSTM、需要負值時'
        },
        linear: {
          name: 'Linear',
          fullName: 'Identity Function',
          emoji: '📏',
          fn: (x) => x,
          derivative: (x) => 1,
          formula: 'x',
          derivFormula: '1',
          range: '(-∞, ∞)',
          pros: ['最簡單', '不會飽和'],
          cons: ['沒有非線性！', '多層等於一層'],
          color: '#64748b',
          useCase: '回歸問題輸出層'
        }
      };

      const func = functions[selectedFunc];
      const output = func.fn(testInput);
      const gradient = func.derivative(testInput);

      // 生成圖表數據
      const generateData = (fn, xMin = -5, xMax = 5, steps = 100) => {
        const data = [];
        for (let i = 0; i <= steps; i++) {
          const x = xMin + (xMax - xMin) * (i / steps);
          const y = fn(x);
          data.push({ x, y: Math.max(-5, Math.min(5, y)) });
        }
        return data;
      };

      const funcData = generateData(func.fn);
      const derivData = generateData(func.derivative);

      // 座標轉換
      const toSvgX = (x, width = 300) => (x + 5) / 10 * width;
      const toSvgY = (y, height = 200) => height / 2 - y / 5 * (height / 2);

      // 繪製路徑
      const dataToPath = (data, width = 300, height = 200) => {
        return data.map((p, i) => 
          `${i === 0 ? 'M' : 'L'} ${toSvgX(p.x, width)} ${toSvgY(p.y, height)}`
        ).join(' ');
      };

      return (
        <div className="container">
          <div className="title">
            <h1>⚡ 激活函數視覺化</h1>
            <p>為什麼神經網路需要非線性？各種激活函數的特性比較</p>
          </div>

          {/* 函數選擇器 */}
          <div className="card">
            <h2>🎯 選擇激活函數</h2>
            <div className="func-selector">
              {Object.entries(functions).map(([key, f]) => (
                <button
                  key={key}
                  className={`func-btn ${selectedFunc === key ? 'active' : ''}`}
                  onClick={() => setSelectedFunc(key)}
                >
                  <span className="emoji">{f.emoji}</span>
                  {f.name}
                </button>
              ))}
            </div>

            {/* 圖表 */}
            <div className="charts-grid">
              {/* 函數圖 */}
              <div className="chart-box">
                <h3>{func.name} 函數</h3>
                <svg className="chart-svg" viewBox="0 0 300 200" height="200">
                  {/* 網格 */}
                  <defs>
                    <pattern id="grid" width="30" height="20" patternUnits="userSpaceOnUse">
                      <path d="M 30 0 L 0 0 0 20" fill="none" stroke="#1e293b" strokeWidth="1"/>
                    </pattern>
                  </defs>
                  <rect width="300" height="200" fill="url(#grid)" />
                  
                  {/* 座標軸 */}
                  <line x1="0" y1="100" x2="300" y2="100" stroke="#475569" strokeWidth="1"/>
                  <line x1="150" y1="0" x2="150" y2="200" stroke="#475569" strokeWidth="1"/>
                  
                  {/* 刻度標籤 */}
                  <text x="290" y="115" fill="#64748b" fontSize="10">x</text>
                  <text x="155" y="15" fill="#64748b" fontSize="10">y</text>
                  <text x="5" y="115" fill="#64748b" fontSize="9">-5</text>
                  <text x="280" y="115" fill="#64748b" fontSize="9">5</text>
                  <text x="155" y="15" fill="#64748b" fontSize="9">5</text>
                  <text x="155" y="195" fill="#64748b" fontSize="9">-5</text>
                  
                  {/* 函數曲線 */}
                  <path
                    d={dataToPath(funcData)}
                    fill="none"
                    stroke={func.color}
                    strokeWidth="3"
                    strokeLinecap="round"
                  />
                  
                  {/* 測試點 */}
                  <circle
                    cx={toSvgX(testInput)}
                    cy={toSvgY(Math.max(-5, Math.min(5, output)))}
                    r="8"
                    fill={func.color}
                    stroke="white"
                    strokeWidth="2"
                  />
                  <text
                    x={toSvgX(testInput) + 12}
                    y={toSvgY(Math.max(-5, Math.min(5, output))) - 8}
                    fill="white"
                    fontSize="11"
                    fontWeight="600"
                  >
                    ({testInput.toFixed(1)}, {output.toFixed(2)})
                  </text>
                </svg>
              </div>

              {/* 導數圖 */}
              <div className="chart-box">
                <h3>{func.name} 導數 (梯度)</h3>
                <svg className="chart-svg" viewBox="0 0 300 200" height="200">
                  <rect width="300" height="200" fill="url(#grid)" />
                  <line x1="0" y1="100" x2="300" y2="100" stroke="#475569" strokeWidth="1"/>
                  <line x1="150" y1="0" x2="150" y2="200" stroke="#475569" strokeWidth="1"/>
                  
                  <text x="5" y="115" fill="#64748b" fontSize="9">-5</text>
                  <text x="280" y="115" fill="#64748b" fontSize="9">5</text>
                  
                  {/* 導數曲線 */}
                  <path
                    d={dataToPath(derivData)}
                    fill="none"
                    stroke="#ef4444"
                    strokeWidth="3"
                    strokeLinecap="round"
                  />
                  
                  {/* 測試點 */}
                  <circle
                    cx={toSvgX(testInput)}
                    cy={toSvgY(Math.max(-5, Math.min(5, gradient)))}
                    r="8"
                    fill="#ef4444"
                    stroke="white"
                    strokeWidth="2"
                  />
                  <text
                    x={toSvgX(testInput) + 12}
                    y={toSvgY(Math.max(-5, Math.min(5, gradient))) - 8}
                    fill="white"
                    fontSize="11"
                    fontWeight="600"
                  >
                    梯度: {gradient.toFixed(3)}
                  </text>
                </svg>
              </div>
            </div>

            {/* 公式 */}
            <div className="formula-box">
              <div className="formula-grid">
                <div className="formula-item">
                  <h4>函數公式</h4>
                  <div className="formula-math">{func.name}(x) = {func.formula}</div>
                </div>
                <div className="formula-item">
                  <h4>導數公式</h4>
                  <div className="formula-math">{func.name}'(x) = {func.derivFormula}</div>
                </div>
              </div>
            </div>

            {/* 互動測試 */}
            <div className="test-section">
              <h3>🧪 互動測試</h3>
              <div className="test-row">
                <div className="test-input">
                  <label>輸入值 x = <span style={{ color: '#60a5fa', fontWeight: 600 }}>{testInput.toFixed(2)}</span></label>
                  <input
                    type="range"
                    min="-5"
                    max="5"
                    step="0.1"
                    value={testInput}
                    onChange={e => setTestInput(parseFloat(e.target.value))}
                  />
                </div>
                <div className="test-results">
                  <div className="test-result">
                    <div className="label">輸入 x</div>
                    <div className={`value ${testInput > 0 ? 'positive' : testInput < 0 ? 'negative' : 'zero'}`}>
                      {testInput.toFixed(2)}
                    </div>
                  </div>
                  <div className="test-result">
                    <div className="label">{func.name}(x)</div>
                    <div className={`value ${output > 0 ? 'positive' : output < 0 ? 'negative' : 'zero'}`}>
                      {output.toFixed(4)}
                    </div>
                  </div>
                  <div className="test-result">
                    <div className="label">梯度</div>
                    <div className={`value ${gradient > 0.1 ? 'positive' : gradient < 0.01 ? 'negative' : 'zero'}`}>
                      {gradient.toFixed(4)}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* 特性 */}
            <div className="props-grid">
              <div className="prop-card">
                <div className="icon">📊</div>
                <div className="label">輸出範圍</div>
                <div className="value">{func.range}</div>
              </div>
              <div className="prop-card">
                <div className="icon">✅</div>
                <div className="label">優點</div>
                <div className="value good">{func.pros[0]}</div>
              </div>
              <div className="prop-card">
                <div className="icon">⚠️</div>
                <div className="label">缺點</div>
                <div className="value bad">{func.cons[0]}</div>
              </div>
              <div className="prop-card">
                <div className="icon">🎯</div>
                <div className="label">使用場景</div>
                <div className="value">{func.useCase}</div>
              </div>
            </div>
          </div>

          {/* 為什麼需要非線性 */}
          <div className="card">
            <h2>🤔 為什麼需要非線性激活函數？</h2>
            <div className="comparison">
              <div className="comparison-box bad">
                <h4>❌ 沒有激活函數（純線性）</h4>
                <p>
                  如果每層都是線性的，不管疊多少層，結果還是線性的！
                </p>
                <div className="code">
                  layer1 = W1 × x<br/>
                  layer2 = W2 × layer1 = W2 × W1 × x<br/>
                  layer3 = W3 × layer2 = W3 × W2 × W1 × x<br/><br/>
                  <span style={{ color: '#f87171' }}>= (W3 × W2 × W1) × x = W × x</span><br/>
                  <span style={{ color: '#64748b' }}>// 三層等於一層！</span>
                </div>
                <p style={{ marginTop: '12px' }}>
                  <strong>結果：</strong>只能學習線性關係（直線），無法處理 XOR 這種簡單問題。
                </p>
              </div>
              <div className="comparison-box good">
                <h4>✅ 有非線性激活函數</h4>
                <p>
                  非線性激活讓每層都能「彎曲」，組合起來可以逼近任何函數！
                </p>
                <div className="code">
                  layer1 = <span style={{ color: '#4ade80' }}>ReLU</span>(W1 × x)<br/>
                  layer2 = <span style={{ color: '#4ade80' }}>ReLU</span>(W2 × layer1)<br/>
                  layer3 = W3 × layer2<br/><br/>
                  <span style={{ color: '#4ade80' }}>// 可以學習任意複雜的函數！</span>
                </div>
                <p style={{ marginTop: '12px' }}>
                  <strong>結果：</strong>可以學習圖像識別、語言理解等複雜任務。
                </p>
              </div>
            </div>

            {/* XOR 示意 */}
            <div style={{ marginTop: '20px', padding: '16px', background: '#0f172a', borderRadius: '12px' }}>
              <h4 style={{ fontSize: '14px', marginBottom: '12px' }}>💡 經典例子：XOR 問題</h4>
              <div style={{ display: 'flex', gap: '40px', flexWrap: 'wrap', alignItems: 'center' }}>
                <svg width="150" height="150" viewBox="0 0 150 150">
                  {/* 座標軸 */}
                  <line x1="20" y1="130" x2="140" y2="130" stroke="#475569" strokeWidth="1"/>
                  <line x1="20" y1="130" x2="20" y2="10" stroke="#475569" strokeWidth="1"/>
                  <text x="75" y="148" fill="#64748b" fontSize="10" textAnchor="middle">x₁</text>
                  <text x="8" y="75" fill="#64748b" fontSize="10">x₂</text>
                  
                  {/* 數據點 */}
                  <circle cx="40" cy="110" r="12" fill="#ef4444"/> {/* (0,0) = 0 */}
                  <circle cx="120" cy="110" r="12" fill="#10b981"/> {/* (1,0) = 1 */}
                  <circle cx="40" cy="30" r="12" fill="#10b981"/> {/* (0,1) = 1 */}
                  <circle cx="120" cy="30" r="12" fill="#ef4444"/> {/* (1,1) = 0 */}
                  
                  <text x="40" y="114" fill="white" fontSize="10" textAnchor="middle">0</text>
                  <text x="120" y="114" fill="white" fontSize="10" textAnchor="middle">1</text>
                  <text x="40" y="34" fill="white" fontSize="10" textAnchor="middle">1</text>
                  <text x="120" y="34" fill="white" fontSize="10" textAnchor="middle">0</text>
                </svg>
                <div style={{ fontSize: '13px', color: '#d1d5db', lineHeight: 1.8 }}>
                  <p><strong>XOR 真值表：</strong></p>
                  <p>0 ⊕ 0 = <span style={{ color: '#ef4444' }}>0</span></p>
                  <p>0 ⊕ 1 = <span style={{ color: '#10b981' }}>1</span></p>
                  <p>1 ⊕ 0 = <span style={{ color: '#10b981' }}>1</span></p>
                  <p>1 ⊕ 1 = <span style={{ color: '#ef4444' }}>0</span></p>
                  <p style={{ marginTop: '8px', color: '#94a3b8' }}>
                    無法用一條直線分開紅綠！<br/>
                    需要非線性才能解決。
                  </p>
                </div>
              </div>
            </div>
          </div>

          {/* 所有函數比較 */}
          <div className="card">
            <h2>📋 激活函數比較表</h2>
            <div style={{ overflowX: 'auto' }}>
              <table className="func-table">
                <thead>
                  <tr>
                    <th>函數</th>
                    <th>輸出範圍</th>
                    <th>梯度消失</th>
                    <th>計算速度</th>
                    <th>推薦用途</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>📐 ReLU</td>
                    <td>[0, ∞)</td>
                    <td><span className="tag tag-good">不會(正區)</span></td>
                    <td><span className="tag tag-good">最快</span></td>
                    <td>隱藏層首選</td>
                  </tr>
                  <tr>
                    <td>📉 Leaky ReLU</td>
                    <td>(-∞, ∞)</td>
                    <td><span className="tag tag-good">不會</span></td>
                    <td><span className="tag tag-good">很快</span></td>
                    <td>ReLU 替代品</td>
                  </tr>
                  <tr>
                    <td>🌊 Sigmoid</td>
                    <td>(0, 1)</td>
                    <td><span className="tag tag-bad">會</span></td>
                    <td><span className="tag tag-warn">較慢</span></td>
                    <td>二分類輸出</td>
                  </tr>
                  <tr>
                    <td>〰️ Tanh</td>
                    <td>(-1, 1)</td>
                    <td><span className="tag tag-bad">會</span></td>
                    <td><span className="tag tag-warn">較慢</span></td>
                    <td>RNN/LSTM</td>
                  </tr>
                  <tr>
                    <td>📏 Linear</td>
                    <td>(-∞, ∞)</td>
                    <td><span className="tag tag-good">不會</span></td>
                    <td><span className="tag tag-good">最快</span></td>
                    <td>回歸輸出層</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div style={{ marginTop: '16px', padding: '12px', background: '#0f172a', borderRadius: '8px', fontSize: '13px' }}>
              <strong style={{ color: '#fbbf24' }}>💡 實用建議：</strong>
              <ul style={{ marginTop: '8px', paddingLeft: '20px', color: '#d1d5db', lineHeight: 1.8 }}>
                <li>隱藏層：先試 <strong>ReLU</strong>，不行再試 Leaky ReLU</li>
                <li>二分類輸出：<strong>Sigmoid</strong></li>
                <li>多分類輸出：<strong>Softmax</strong>（這裡沒列）</li>
                <li>回歸輸出：<strong>Linear</strong>（不加激活函數）</li>
                <li>RNN/LSTM：<strong>Tanh</strong></li>
              </ul>
            </div>
          </div>

          {/* micrograd 中的實現 */}
          <div className="card">
            <h2>💻 micrograd 中的激活函數</h2>
            <div style={{ background: '#0f172a', borderRadius: '10px', padding: '16px', fontFamily: 'monospace', fontSize: '12px', lineHeight: 1.8 }}>
              <span style={{ color: '#6b7280' }}># ReLU 實現</span><br/>
              <span style={{ color: '#c084fc' }}>def</span> <span style={{ color: '#60a5fa' }}>relu</span>(self):<br/>
              &nbsp;&nbsp;out = Value(<span style={{ color: '#4ade80' }}>0</span> <span style={{ color: '#c084fc' }}>if</span> self.data {'<'} <span style={{ color: '#4ade80' }}>0</span> <span style={{ color: '#c084fc' }}>else</span> self.data)<br/>
              &nbsp;&nbsp;<br/>
              &nbsp;&nbsp;<span style={{ color: '#6b7280' }}># 反向傳播：梯度要乘上 ReLU 的導數</span><br/>
              &nbsp;&nbsp;<span style={{ color: '#c084fc' }}>def</span> <span style={{ color: '#60a5fa' }}>_backward</span>():<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;self.grad += (<span style={{ color: '#4ade80' }}>1</span> <span style={{ color: '#c084fc' }}>if</span> out.data {'>'} <span style={{ color: '#4ade80' }}>0</span> <span style={{ color: '#c084fc' }}>else</span> <span style={{ color: '#4ade80' }}>0</span>) * out.grad<br/>
              &nbsp;&nbsp;<br/>
              &nbsp;&nbsp;<span style={{ color: '#c084fc' }}>return</span> out<br/><br/>

              <span style={{ color: '#6b7280' }}># Tanh 實現</span><br/>
              <span style={{ color: '#c084fc' }}>def</span> <span style={{ color: '#60a5fa' }}>tanh</span>(self):<br/>
              &nbsp;&nbsp;t = math.tanh(self.data)<br/>
              &nbsp;&nbsp;out = Value(t)<br/>
              &nbsp;&nbsp;<br/>
              &nbsp;&nbsp;<span style={{ color: '#6b7280' }}># 反向傳播：tanh 的導數是 1 - tanh²</span><br/>
              &nbsp;&nbsp;<span style={{ color: '#c084fc' }}>def</span> <span style={{ color: '#60a5fa' }}>_backward</span>():<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;self.grad += (<span style={{ color: '#4ade80' }}>1</span> - t**<span style={{ color: '#4ade80' }}>2</span>) * out.grad<br/>
              &nbsp;&nbsp;<br/>
              &nbsp;&nbsp;<span style={{ color: '#c084fc' }}>return</span> out
            </div>
          </div>

          <div className="footer">星智未來 · ML 數學視覺化 · 激活函數</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ActivationFunctions />);
  </script>
</body>
</html>
