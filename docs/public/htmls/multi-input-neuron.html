<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多輸入神經元 | 星智未來</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white; 
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .title { text-align: center; margin-bottom: 24px; }
    .title h1 { font-size: 26px; margin-bottom: 8px; }
    .title p { color: #94a3b8; font-size: 14px; }
    
    .card { 
      background: rgba(30, 41, 59, 0.9); 
      border-radius: 16px; 
      padding: 24px; 
      margin-bottom: 20px;
    }
    .card h2 { 
      font-size: 17px; margin-bottom: 16px; 
      display: flex; align-items: center; gap: 10px;
    }

    /* 主佈局 */
    .main-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* 控制面板 */
    .control-panel {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
    }
    .control-section {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
    }
    .control-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }
    .control-section h3 {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .slider-item {
      margin-bottom: 14px;
    }
    .slider-item:last-child { margin-bottom: 0; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .slider-label .name { color: #e2e8f0; }
    .slider-label .value { color: #60a5fa; font-weight: 600; font-family: monospace; }
    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      background: #3b82f6;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"].input-slider::-webkit-slider-thumb { background: #6366f1; }
    input[type="range"].weight-slider::-webkit-slider-thumb { background: #8b5cf6; }
    input[type="range"].bias-slider::-webkit-slider-thumb { background: #f59e0b; }

    /* 激活函數選擇 */
    .activation-select {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .activation-btn {
      padding: 8px 12px;
      border: 2px solid #334155;
      border-radius: 6px;
      background: transparent;
      color: #e2e8f0;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .activation-btn:hover { border-color: #60a5fa; }
    .activation-btn.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.2);
    }

    /* 神經元視覺化 */
    .neuron-viz {
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
    }
    .neuron-svg {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 計算過程 */
    .calc-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      padding: 16px;
      background: #1e293b;
      border-radius: 10px;
    }
    .calc-step {
      text-align: center;
      padding: 10px 16px;
      background: #0f172a;
      border-radius: 8px;
      min-width: 80px;
    }
    .calc-step .label {
      font-size: 10px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .calc-step .value {
      font-size: 18px;
      font-weight: 700;
      font-family: monospace;
    }
    .calc-step .formula {
      font-size: 9px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .calc-arrow {
      font-size: 20px;
      color: #475569;
    }

    /* 決策邊界 */
    .boundary-section {
      margin-top: 20px;
    }
    .boundary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 700px) {
      .boundary-grid { grid-template-columns: 1fr; }
    }
    .boundary-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 16px;
    }
    .boundary-box h4 {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      text-align: center;
    }

    /* 公式展示 */
    .formula-display {
      background: #0f172a;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
    .formula-main {
      font-size: 20px;
      text-align: center;
      font-family: 'Times New Roman', serif;
      margin-bottom: 16px;
      padding: 16px;
      background: #1e293b;
      border-radius: 8px;
    }
    .formula-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .formula-part {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
    }
    .formula-part .label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .formula-part .content {
      font-size: 14px;
      font-family: monospace;
    }

    /* 生物比喻 */
    .bio-analogy {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(6, 95, 70, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    .bio-analogy h3 {
      font-size: 15px;
      color: #4ade80;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .bio-item {
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .bio-item .icon { font-size: 28px; margin-bottom: 6px; }
    .bio-item .name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .bio-item .desc { font-size: 10px; color: #94a3b8; }

    /* 輸出指示器 */
    .output-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      padding: 16px;
      background: #1e293b;
      border-radius: 10px;
    }
    .output-gauge {
      width: 120px;
      height: 120px;
      position: relative;
    }
    .output-gauge svg {
      transform: rotate(-90deg);
    }
    .output-gauge .value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      font-weight: 700;
    }
    .output-info {
      text-align: left;
    }
    .output-info .label { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .output-info .text { font-size: 16px; font-weight: 600; }
    .output-info .hint { font-size: 11px; color: #94a3b8; margin-top: 8px; }

    .footer { text-align: center; color: #475569; font-size: 12px; margin-top: 30px; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useMemo } = React;

    function MultiInputNeuron() {
      // 輸入
      const [x1, setX1] = useState(1.0);
      const [x2, setX2] = useState(0.5);
      const [x3, setX3] = useState(-0.5);
      
      // 權重
      const [w1, setW1] = useState(0.8);
      const [w2, setW2] = useState(-0.5);
      const [w3, setW3] = useState(0.3);
      
      // 偏置
      const [bias, setBias] = useState(0.1);
      
      // 激活函數
      const [activation, setActivation] = useState('sigmoid');

      // 激活函數定義
      const activations = {
        linear: { name: 'Linear', fn: z => z, emoji: '📏' },
        relu: { name: 'ReLU', fn: z => Math.max(0, z), emoji: '📐' },
        sigmoid: { name: 'Sigmoid', fn: z => 1 / (1 + Math.exp(-z)), emoji: '🌊' },
        tanh: { name: 'Tanh', fn: z => Math.tanh(z), emoji: '〰️' },
      };

      // 計算
      const z = x1 * w1 + x2 * w2 + x3 * w3 + bias;  // 加權和
      const output = activations[activation].fn(z);   // 激活後輸出

      // 各項貢獻
      const contrib1 = x1 * w1;
      const contrib2 = x2 * w2;
      const contrib3 = x3 * w3;

      // 決策邊界數據（2D 切片，固定 x3）
      const boundaryData = useMemo(() => {
        const data = [];
        const gridSize = 30;
        for (let i = 0; i <= gridSize; i++) {
          for (let j = 0; j <= gridSize; j++) {
            const px1 = -2 + (4 * i / gridSize);
            const px2 = -2 + (4 * j / gridSize);
            const pz = px1 * w1 + px2 * w2 + x3 * w3 + bias;
            const pOut = activations[activation].fn(pz);
            data.push({ x1: px1, x2: px2, output: pOut });
          }
        }
        return data;
      }, [w1, w2, w3, x3, bias, activation]);

      // 顏色映射
      const getColor = (val) => {
        const t = Math.max(0, Math.min(1, val));
        const r = Math.round(239 * (1 - t) + 74 * t);
        const g = Math.round(68 * (1 - t) + 222 * t);
        const b = Math.round(68 * (1 - t) + 128 * t);
        return `rgb(${r},${g},${b})`;
      };

      // 輸出顏色
      const outputColor = output > 0.5 ? '#4ade80' : output < 0.5 ? '#ef4444' : '#fbbf24';

      return (
        <div className="container">
          <div className="title">
            <h1>🧬 多輸入神經元</h1>
            <p>理解單個神經元如何整合多個輸入並做出決策</p>
          </div>

          <div className="card">
            <div className="main-grid">
              {/* 左側控制面板 */}
              <div className="control-panel">
                {/* 輸入 */}
                <div className="control-section">
                  <h3>📥 輸入 (Inputs)</h3>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">x₁</span>
                      <span className="value">{x1.toFixed(2)}</span>
                    </div>
                    <input type="range" className="input-slider" min="-2" max="2" step="0.1"
                      value={x1} onChange={e => setX1(parseFloat(e.target.value))} />
                  </div>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">x₂</span>
                      <span className="value">{x2.toFixed(2)}</span>
                    </div>
                    <input type="range" className="input-slider" min="-2" max="2" step="0.1"
                      value={x2} onChange={e => setX2(parseFloat(e.target.value))} />
                  </div>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">x₃</span>
                      <span className="value">{x3.toFixed(2)}</span>
                    </div>
                    <input type="range" className="input-slider" min="-2" max="2" step="0.1"
                      value={x3} onChange={e => setX3(parseFloat(e.target.value))} />
                  </div>
                </div>

                {/* 權重 */}
                <div className="control-section">
                  <h3>⚖️ 權重 (Weights)</h3>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">w₁</span>
                      <span className="value">{w1.toFixed(2)}</span>
                    </div>
                    <input type="range" className="weight-slider" min="-2" max="2" step="0.1"
                      value={w1} onChange={e => setW1(parseFloat(e.target.value))} />
                  </div>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">w₂</span>
                      <span className="value">{w2.toFixed(2)}</span>
                    </div>
                    <input type="range" className="weight-slider" min="-2" max="2" step="0.1"
                      value={w2} onChange={e => setW2(parseFloat(e.target.value))} />
                  </div>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">w₃</span>
                      <span className="value">{w3.toFixed(2)}</span>
                    </div>
                    <input type="range" className="weight-slider" min="-2" max="2" step="0.1"
                      value={w3} onChange={e => setW3(parseFloat(e.target.value))} />
                  </div>
                </div>

                {/* 偏置 */}
                <div className="control-section">
                  <h3>📍 偏置 (Bias)</h3>
                  <div className="slider-item">
                    <div className="slider-label">
                      <span className="name">b</span>
                      <span className="value">{bias.toFixed(2)}</span>
                    </div>
                    <input type="range" className="bias-slider" min="-3" max="3" step="0.1"
                      value={bias} onChange={e => setBias(parseFloat(e.target.value))} />
                  </div>
                </div>

                {/* 激活函數 */}
                <div className="control-section">
                  <h3>⚡ 激活函數</h3>
                  <div className="activation-select">
                    {Object.entries(activations).map(([key, act]) => (
                      <button
                        key={key}
                        className={`activation-btn ${activation === key ? 'active' : ''}`}
                        onClick={() => setActivation(key)}
                      >
                        {act.emoji} {act.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* 右側視覺化 */}
              <div>
                {/* 神經元圖 */}
                <div className="neuron-viz">
                  <svg className="neuron-svg" viewBox="0 0 500 300" height="280">
                    {/* 輸入節點 */}
                    <g>
                      {/* x1 */}
                      <circle cx="60" cy="60" r="30" fill="#6366f1" opacity="0.9"/>
                      <text x="60" y="55" textAnchor="middle" fill="white" fontSize="14" fontWeight="600">x₁</text>
                      <text x="60" y="72" textAnchor="middle" fill="white" fontSize="11">{x1.toFixed(2)}</text>
                      
                      {/* x2 */}
                      <circle cx="60" cy="150" r="30" fill="#6366f1" opacity="0.9"/>
                      <text x="60" y="145" textAnchor="middle" fill="white" fontSize="14" fontWeight="600">x₂</text>
                      <text x="60" y="162" textAnchor="middle" fill="white" fontSize="11">{x2.toFixed(2)}</text>
                      
                      {/* x3 */}
                      <circle cx="60" cy="240" r="30" fill="#6366f1" opacity="0.9"/>
                      <text x="60" y="235" textAnchor="middle" fill="white" fontSize="14" fontWeight="600">x₃</text>
                      <text x="60" y="252" textAnchor="middle" fill="white" fontSize="11">{x3.toFixed(2)}</text>
                    </g>

                    {/* 連線與權重 */}
                    <g>
                      {/* x1 → neuron */}
                      <line x1="90" y1="60" x2="210" y2="140" 
                        stroke={contrib1 >= 0 ? '#4ade80' : '#ef4444'} 
                        strokeWidth={Math.max(1, Math.abs(contrib1) * 3)} 
                        opacity="0.7"/>
                      <rect x="130" y="85" width="50" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
                      <text x="155" y="100" textAnchor="middle" fill="#8b5cf6" fontSize="10">
                        w₁={w1.toFixed(1)}
                      </text>
                      
                      {/* x2 → neuron */}
                      <line x1="90" y1="150" x2="210" y2="150" 
                        stroke={contrib2 >= 0 ? '#4ade80' : '#ef4444'} 
                        strokeWidth={Math.max(1, Math.abs(contrib2) * 3)} 
                        opacity="0.7"/>
                      <rect x="130" y="130" width="50" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
                      <text x="155" y="145" textAnchor="middle" fill="#8b5cf6" fontSize="10">
                        w₂={w2.toFixed(1)}
                      </text>
                      
                      {/* x3 → neuron */}
                      <line x1="90" y1="240" x2="210" y2="160" 
                        stroke={contrib3 >= 0 ? '#4ade80' : '#ef4444'} 
                        strokeWidth={Math.max(1, Math.abs(contrib3) * 3)} 
                        opacity="0.7"/>
                      <rect x="130" y="195" width="50" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
                      <text x="155" y="210" textAnchor="middle" fill="#8b5cf6" fontSize="10">
                        w₃={w3.toFixed(1)}
                      </text>
                    </g>

                    {/* 神經元（加總 + 激活）*/}
                    <g>
                      {/* 加總區 */}
                      <ellipse cx="250" cy="150" rx="45" ry="55" fill="#1e293b" stroke="#475569" strokeWidth="2"/>
                      <text x="250" y="130" textAnchor="middle" fill="#94a3b8" fontSize="11">Σ + b</text>
                      <text x="250" y="150" textAnchor="middle" fill="#fbbf24" fontSize="14" fontWeight="600">
                        z = {z.toFixed(2)}
                      </text>
                      <text x="250" y="170" textAnchor="middle" fill="#64748b" fontSize="9">
                        (加權和)
                      </text>
                      
                      {/* 激活函數 */}
                      <rect x="310" y="120" width="70" height="60" rx="8" fill="#f59e0b" opacity="0.9"/>
                      <text x="345" y="145" textAnchor="middle" fill="white" fontSize="11">
                        {activations[activation].emoji}
                      </text>
                      <text x="345" y="162" textAnchor="middle" fill="white" fontSize="10" fontWeight="600">
                        {activations[activation].name}
                      </text>
                    </g>

                    {/* 連接線 */}
                    <line x1="295" y1="150" x2="310" y2="150" stroke="#475569" strokeWidth="2"/>
                    <line x1="380" y1="150" x2="410" y2="150" stroke="#475569" strokeWidth="2"/>

                    {/* 輸出 */}
                    <g>
                      <circle cx="450" cy="150" r="35" fill={outputColor} opacity="0.9"/>
                      <text x="450" y="145" textAnchor="middle" fill="white" fontSize="11">輸出</text>
                      <text x="450" y="165" textAnchor="middle" fill="white" fontSize="16" fontWeight="700">
                        {output.toFixed(3)}
                      </text>
                    </g>

                    {/* Bias 標註 */}
                    <g>
                      <line x1="250" y1="220" x2="250" y2="205" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4"/>
                      <circle cx="250" cy="235" r="18" fill="#f59e0b" opacity="0.8"/>
                      <text x="250" y="240" textAnchor="middle" fill="white" fontSize="10" fontWeight="600">
                        b={bias.toFixed(1)}
                      </text>
                    </g>

                    {/* 圖例 */}
                    <g transform="translate(10, 280)">
                      <rect x="0" y="0" width="10" height="10" fill="#4ade80"/>
                      <text x="15" y="9" fill="#94a3b8" fontSize="9">正向貢獻</text>
                      <rect x="80" y="0" width="10" height="10" fill="#ef4444"/>
                      <text x="95" y="9" fill="#94a3b8" fontSize="9">負向貢獻</text>
                    </g>
                  </svg>
                </div>

                {/* 計算流程 */}
                <div className="calc-flow">
                  <div className="calc-step">
                    <div className="label">x₁×w₁</div>
                    <div className="value" style={{ color: contrib1 >= 0 ? '#4ade80' : '#ef4444' }}>
                      {contrib1.toFixed(2)}
                    </div>
                    <div className="formula">{x1.toFixed(1)}×{w1.toFixed(1)}</div>
                  </div>
                  <div className="calc-arrow">+</div>
                  <div className="calc-step">
                    <div className="label">x₂×w₂</div>
                    <div className="value" style={{ color: contrib2 >= 0 ? '#4ade80' : '#ef4444' }}>
                      {contrib2.toFixed(2)}
                    </div>
                    <div className="formula">{x2.toFixed(1)}×{w2.toFixed(1)}</div>
                  </div>
                  <div className="calc-arrow">+</div>
                  <div className="calc-step">
                    <div className="label">x₃×w₃</div>
                    <div className="value" style={{ color: contrib3 >= 0 ? '#4ade80' : '#ef4444' }}>
                      {contrib3.toFixed(2)}
                    </div>
                    <div className="formula">{x3.toFixed(1)}×{w3.toFixed(1)}</div>
                  </div>
                  <div className="calc-arrow">+</div>
                  <div className="calc-step">
                    <div className="label">bias</div>
                    <div className="value" style={{ color: '#f59e0b' }}>
                      {bias.toFixed(2)}
                    </div>
                  </div>
                  <div className="calc-arrow">=</div>
                  <div className="calc-step">
                    <div className="label">z (加權和)</div>
                    <div className="value" style={{ color: '#fbbf24' }}>
                      {z.toFixed(2)}
                    </div>
                  </div>
                  <div className="calc-arrow">→</div>
                  <div className="calc-step" style={{ background: outputColor, color: 'white' }}>
                    <div className="label" style={{ color: 'rgba(255,255,255,0.8)' }}>輸出</div>
                    <div className="value" style={{ color: 'white' }}>
                      {output.toFixed(3)}
                    </div>
                    <div className="formula" style={{ color: 'rgba(255,255,255,0.7)' }}>
                      {activation}(z)
                    </div>
                  </div>
                </div>

                {/* 輸出解讀 */}
                <div className="output-indicator">
                  <div className="output-gauge">
                    <svg width="120" height="120" viewBox="0 0 120 120">
                      <circle cx="60" cy="60" r="50" fill="none" stroke="#1e293b" strokeWidth="10"/>
                      <circle cx="60" cy="60" r="50" fill="none" stroke={outputColor} strokeWidth="10"
                        strokeDasharray={`${output * 314} 314`}
                        strokeLinecap="round"/>
                    </svg>
                    <div className="value" style={{ color: outputColor }}>{(output * 100).toFixed(0)}%</div>
                  </div>
                  <div className="output-info">
                    <div className="label">神經元判斷</div>
                    <div className="text" style={{ color: outputColor }}>
                      {activation === 'sigmoid' 
                        ? (output > 0.5 ? '✅ 激活 (輸出 > 0.5)' : '❌ 未激活 (輸出 ≤ 0.5)')
                        : activation === 'relu'
                        ? (output > 0 ? '✅ 激活 (輸出 > 0)' : '❌ 未激活 (輸出 = 0)')
                        : `輸出值: ${output.toFixed(3)}`
                      }
                    </div>
                    <div className="hint">
                      {activation === 'sigmoid' && '像二分類的信心程度'}
                      {activation === 'relu' && '負輸入被「關閉」'}
                      {activation === 'tanh' && '輸出在 -1 到 1 之間'}
                      {activation === 'linear' && '直接輸出加權和'}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* 決策邊界視覺化 */}
          <div className="card">
            <h2>🗺️ 決策邊界視覺化</h2>
            <p style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '16px' }}>
              固定 x₃ = {x3.toFixed(1)}，觀察神經元在 x₁-x₂ 平面上的輸出分布
            </p>
            <div className="boundary-grid">
              <div className="boundary-box">
                <h4>輸出熱力圖</h4>
                <svg viewBox="0 0 200 200" width="100%" height="200">
                  {/* 熱力圖 */}
                  {boundaryData.map((d, i) => {
                    const px = ((d.x1 + 2) / 4) * 180 + 10;
                    const py = 190 - ((d.x2 + 2) / 4) * 180;
                    return (
                      <rect key={i} x={px - 3} y={py - 3} width="6" height="6"
                        fill={getColor(d.output)} opacity="0.8"/>
                    );
                  })}
                  
                  {/* 當前點 */}
                  <circle 
                    cx={((x1 + 2) / 4) * 180 + 10}
                    cy={190 - ((x2 + 2) / 4) * 180}
                    r="8" fill="white" stroke={outputColor} strokeWidth="3"/>
                  
                  {/* 座標軸標籤 */}
                  <text x="100" y="198" textAnchor="middle" fill="#64748b" fontSize="10">x₁</text>
                  <text x="5" y="100" fill="#64748b" fontSize="10" transform="rotate(-90, 5, 100)">x₂</text>
                  <text x="10" y="195" fill="#64748b" fontSize="8">-2</text>
                  <text x="185" y="195" fill="#64748b" fontSize="8">2</text>
                </svg>
              </div>
              <div className="boundary-box">
                <h4>決策邊界說明</h4>
                <div style={{ fontSize: '13px', color: '#d1d5db', lineHeight: 1.8 }}>
                  <p><strong style={{ color: '#4ade80' }}>綠色區域</strong>：輸出接近 1</p>
                  <p><strong style={{ color: '#ef4444' }}>紅色區域</strong>：輸出接近 0</p>
                  <p><strong style={{ color: 'white' }}>白點</strong>：當前輸入位置</p>
                  <div style={{ marginTop: '12px', padding: '10px', background: '#1e293b', borderRadius: '6px', fontSize: '11px' }}>
                    <p><strong>決策邊界方程式：</strong></p>
                    <p style={{ fontFamily: 'monospace', marginTop: '4px' }}>
                      {w1.toFixed(1)}·x₁ + {w2.toFixed(1)}·x₂ + {(w3 * x3 + bias).toFixed(2)} = 0
                    </p>
                    <p style={{ color: '#94a3b8', marginTop: '8px' }}>
                      這是一條直線！單個神經元只能學習線性邊界。
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* 公式展示 */}
          <div className="card">
            <h2>📐 數學公式</h2>
            <div className="formula-display">
              <div className="formula-main">
                y = σ( w₁x₁ + w₂x₂ + w₃x₃ + b )
              </div>
              <div className="formula-breakdown">
                <div className="formula-part">
                  <div className="label">1. 加權和（線性組合）</div>
                  <div className="content">
                    z = Σ wᵢxᵢ + b<br/>
                    <span style={{ color: '#64748b', fontSize: '12px' }}>
                      = {w1.toFixed(2)}×{x1.toFixed(2)} + {w2.toFixed(2)}×{x2.toFixed(2)} + {w3.toFixed(2)}×{x3.toFixed(2)} + {bias.toFixed(2)}<br/>
                      = <span style={{ color: '#fbbf24' }}>{z.toFixed(4)}</span>
                    </span>
                  </div>
                </div>
                <div className="formula-part">
                  <div className="label">2. 激活函數（非線性轉換）</div>
                  <div className="content">
                    y = {activation}(z)<br/>
                    <span style={{ color: '#64748b', fontSize: '12px' }}>
                      = {activation}({z.toFixed(4)})<br/>
                      = <span style={{ color: outputColor }}>{output.toFixed(4)}</span>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* 生物比喻 */}
          <div className="card">
            <div className="bio-analogy">
              <h3>🧠 生物神經元比喻</h3>
              <div className="bio-grid">
                <div className="bio-item">
                  <div className="icon">🌿</div>
                  <div className="name">樹突 (Dendrites)</div>
                  <div className="desc">接收輸入信號 x₁, x₂, x₃</div>
                </div>
                <div className="bio-item">
                  <div className="icon">⚖️</div>
                  <div className="name">突觸強度 (Synapses)</div>
                  <div className="desc">權重 w₁, w₂, w₃ 調節信號強度</div>
                </div>
                <div className="bio-item">
                  <div className="icon">🔵</div>
                  <div className="name">細胞體 (Soma)</div>
                  <div className="desc">加總所有輸入 Σ + bias</div>
                </div>
                <div className="bio-item">
                  <div className="icon">⚡</div>
                  <div className="name">閾值 (Threshold)</div>
                  <div className="desc">激活函數決定是否「發射」</div>
                </div>
                <div className="bio-item">
                  <div className="icon">📡</div>
                  <div className="name">軸突 (Axon)</div>
                  <div className="desc">輸出信號傳給下一層</div>
                </div>
              </div>
            </div>
          </div>

          {/* micrograd 代碼 */}
          <div className="card">
            <h2>💻 micrograd 實現</h2>
            <div style={{ background: '#0f172a', borderRadius: '10px', padding: '16px', fontFamily: 'monospace', fontSize: '12px', lineHeight: 1.8 }}>
              <span style={{ color: '#6b7280' }}># 定義一個神經元</span><br/>
              <span style={{ color: '#c084fc' }}>class</span> <span style={{ color: '#60a5fa' }}>Neuron</span>:<br/>
              &nbsp;&nbsp;<span style={{ color: '#c084fc' }}>def</span> <span style={{ color: '#60a5fa' }}>__init__</span>(self, nin): <span style={{ color: '#6b7280' }}># nin = 輸入數量</span><br/>
              &nbsp;&nbsp;&nbsp;&nbsp;self.w = [Value(random.uniform(-1,1)) <span style={{ color: '#c084fc' }}>for</span> _ <span style={{ color: '#c084fc' }}>in</span> range(nin)]<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;self.b = Value(random.uniform(-1,1))<br/>
              <br/>
              &nbsp;&nbsp;<span style={{ color: '#c084fc' }}>def</span> <span style={{ color: '#60a5fa' }}>__call__</span>(self, x):<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;<span style={{ color: '#6b7280' }}># 加權和: w·x + b</span><br/>
              &nbsp;&nbsp;&nbsp;&nbsp;act = <span style={{ color: '#fbbf24' }}>sum</span>((wi*xi <span style={{ color: '#c084fc' }}>for</span> wi, xi <span style={{ color: '#c084fc' }}>in</span> <span style={{ color: '#fbbf24' }}>zip</span>(self.w, x)), self.b)<br/>
              &nbsp;&nbsp;&nbsp;&nbsp;<span style={{ color: '#6b7280' }}># 激活函數</span><br/>
              &nbsp;&nbsp;&nbsp;&nbsp;<span style={{ color: '#c084fc' }}>return</span> act.tanh()<br/>
              <br/>
              <span style={{ color: '#6b7280' }}># 使用</span><br/>
              n = Neuron(<span style={{ color: '#4ade80' }}>3</span>) <span style={{ color: '#6b7280' }}># 3 個輸入的神經元</span><br/>
              x = [Value({x1.toFixed(1)}), Value({x2.toFixed(1)}), Value({x3.toFixed(1)})]<br/>
              y = n(x) <span style={{ color: '#6b7280' }}># 前向傳播，自動建立計算圖</span><br/>
              y.backward() <span style={{ color: '#6b7280' }}># 反向傳播，自動計算所有梯度</span>
            </div>
          </div>

          <div className="footer">星智未來 · ML 數學視覺化 · 多輸入神經元</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MultiInputNeuron />);
  </script>
</body>
</html>
